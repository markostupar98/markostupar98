<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Marko Stupar — police officer turned software engineer">
<title>Marko Stupar — police officer turned software engineer</title>
<style>
  .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .sans{font-family:'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif}
  .walk{animation:walk 12s linear infinite}
  .cop{animation:cop 12s step-end infinite}
  .dev{animation:dev 12s step-end infinite}
  .f0{animation:legs .36s step-end infinite}
  .f1{opacity:0;animation:legs .36s step-end -.18s infinite}
  .poof .p{opacity:0;animation:poof 12s ease-out infinite}
  .tick{animation:tick 12s ease-out infinite}
  .caret{animation:caret 1s step-end infinite}
  @keyframes walk{from{transform:translateX(-60px)}to{transform:translateX(1260px)}}
  @keyframes cop{0%{opacity:1}48.2%{opacity:0}100%{opacity:0}}
  @keyframes dev{0%{opacity:0}48.2%{opacity:1}100%{opacity:1}}
  @keyframes legs{0%{opacity:1}50%{opacity:0}}
  @keyframes poof{0%,47.5%{opacity:0;transform:translate(0,0)}48.2%{opacity:1;transform:translate(0,0)}53%,100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
  @keyframes tick{0%,47%{fill:#24242a}48.2%{fill:#e5a54b}70%,100%{fill:#6b4a1f}}
  @keyframes caret{0%{opacity:1}50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .walk{animation:none;transform:translateX(820px)}
    .cop{animation:none;opacity:0}.dev{animation:none;opacity:1}
    .f1,.poof{display:none}.f0,.tick,.caret{animation:none}
  }
</style>
